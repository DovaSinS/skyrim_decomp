name: Claim functions
description: Reserve one function or a batch before reconstructing it
title: "claim: sse-steam-1-7-104 <RVA, class or range> (<N> functions)"
labels: [claim]
body:
  - type: markdown
    attributes:
      value: >-
        A claim may cover one function, several classes or half-open RVA ranges. Claims lapse
        after 24 hours without an issue update, comment or linked pull request. The older claim
        wins an overlap. To release one member, edit the scope; close the issue to release all.
        Paste only public metadata, never game files, bytes, listings or private paths.
  - type: textarea
    id: body
    attributes:
      label: Claimant, build and complete function scope
      description: Paste the helper's entire claim body, including its skyrim-claim-v1 fenced block. This field's prefill ID is body.
      placeholder: |
        Claimant: @your-login
        Build: sse-steam-1-7-104
        ```text
        skyrim-claim-v1 sse-steam-1-7-104
        0x<RVA> [public name]
        ```
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan and AI assistance (optional)
      description: Name the person and actual model, if assisted. This field's prefill ID is plan.
    validations:
      required: false
